server {
    listen 80;
    listen [::]:80;

    # Reemplazar "_" por el dominio cuando el DNS apunte a esta VPS.
    server_name _;

    root /var/www/hbdigitalstudio;
    index index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    location ^~ /fonts/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    location ~* \.(?:png|jpg|jpeg|webp|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
